name: Termux Push Bridge

on:
  push:
    branches: [push-bridge]
    paths:
      - "push-bridge/command.json"

# Actions only announces a mailbox change. Termux fetches the command,
# executes it, and publishes the result with its local GitHub CLI identity.
permissions:
  contents: read
  id-token: write

concurrency:
  group: termux-push-bridge-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Ignore commits that do not contain a ready command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          if jq -e '.version == 1 and .status == "ready"' push-bridge/command.json >/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No ready command in this commit; event ignored."
          fi

      - name: Send a signed push event to this user's Termux Bridge
        if: steps.command.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TUNNEL_URL="$(tr -d '\r\n' < push-bridge/tunnel-url.txt)"
          case "$TUNNEL_URL" in
            https://*.tunnl.gg) ;;
            *) echo "push-bridge/tunnel-url.txt does not contain a valid tunnl.gg HTTPS URL" >&2; exit 1 ;;
          esac

          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=termux-push-bridge"
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url" | jq -er '.value')"
          echo "::add-mask::${oidc_token}"

          python3 - <<'PY' > /tmp/bridge-event.json
          import json, os, time
          print(json.dumps({
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "after": os.environ["GITHUB_SHA"],
              "timestamp": int(time.time()),
          }, separators=(",", ":")))
          PY

          status="$(curl --silent --show-error --output /tmp/bridge-response.json \
            --write-out '%{http_code}' --connect-timeout 15 --max-time 40 \
            -X POST "${TUNNEL_URL%/}/webhook" \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Termux-Push-Bridge" \
            --data-binary @/tmp/bridge-event.json)"
          cat /tmp/bridge-response.json
          case "$status" in
            200|202) ;;
            *) echo "Termux Bridge rejected the push event (HTTP $status)." >&2; exit 1 ;;
          esac
          echo "Event delivered. HTTP $status means accepted, not command completion."
