name: Android Remote Bridge

on:
  push:
    branches: [main]
    paths:
      - "mailbox/command.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: android-remote-bridge-mailbox
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out operational mailbox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check whether a command is pending
        id: command
        shell: bash
        run: |
          if jq -e '.status == "pending"' mailbox/command.json >/dev/null; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "No pending command; this run will do nothing."
          fi

      - name: Validate endpoint and obtain short-lived OIDC token
        if: steps.command.outputs.pending == 'true'
        id: auth
        shell: bash
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_TUNNEL_URL }}
        run: |
          set -euo pipefail
          case "$BRIDGE_URL" in
            https://*) ;;
            *) echo "BRIDGE_TUNNEL_URL must be an HTTPS URL" >&2; exit 1 ;;
          esac
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=termux-bridge"
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$token_url" | jq -er '.value')"
          echo "::add-mask::${oidc_token}"
          echo "oidc_token=${oidc_token}" >> "$GITHUB_OUTPUT"

      - name: Send command to this user's Android Bridge
        if: steps.command.outputs.pending == 'true'
        shell: bash
        env:
          BRIDGE_URL: ${{ vars.BRIDGE_TUNNEL_URL }}
          OIDC_TOKEN: ${{ steps.auth.outputs.oidc_token }}
        run: |
          set -euo pipefail
          test -s mailbox/command.json
          if ! jq -e '.status == "pending"' mailbox/command.json >/dev/null; then
            echo "No pending command; nothing to dispatch."
            exit 0
          fi
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            -X POST "${BRIDGE_URL%/}/webhook" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @mailbox/command.json \
            --output /tmp/bridge-response.json
          jq -e --slurpfile command mailbox/command.json '
            .accepted == true
            and (.result | type == "object")
            and .result.id == $command[0].id
            and .result.sequence == $command[0].sequence
            and (.result.status == "completed" or .result.status == "failed")
          ' /tmp/bridge-response.json >/dev/null
          jq '.result' /tmp/bridge-response.json > mailbox/result.json

      - name: Publish result to this user's private mailbox
        if: steps.command.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "android-remote-bridge[bot]"
          git config user.email "android-remote-bridge[bot]@users.noreply.github.com"
          git add mailbox/result.json
          if git diff --cached --quiet; then
            echo "No result change to publish."
            exit 0
          fi
          git commit -m "bridge: publish command result"
          git push
